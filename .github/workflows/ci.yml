name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .mvn/wrapper/maven-wrapper.properties

      - name: Compile and package
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests clean package

  unit-tests:
    name: Unit tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .mvn/wrapper/maven-wrapper.properties
          cache-read-only: true

      - name: Run unit tests
        run: ./mvnw --batch-mode --no-transfer-progress clean test

      - name: Upload unit test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore
          retention-days: 14

  integration-tests:
    name: Integration tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .mvn/wrapper/maven-wrapper.properties
          cache-read-only: true

      - name: Run integration tests
        run: ./mvnw --batch-mode --no-transfer-progress -Pintegration -DskipUnitTests=true clean verify

      - name: Upload integration test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: '**/target/failsafe-reports/'
          if-no-files-found: ignore
          retention-days: 14

  prediction-service:
    name: Prediction service tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: prediction-service
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            prediction-service/requirements.txt
            prediction-service/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --no-input --disable-pip-version-check -r requirements-dev.txt

      - name: Generate gRPC stubs
        run: python generate_stubs.py

      - name: Run tests
        run: python -m pytest -q
