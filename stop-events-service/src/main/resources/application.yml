spring:
  application:
    name: stop-events-service
  main:
    web-application-type: none
  datasource:
    url: ${STOP_EVENTS_DB_URL}
    username: ${STOP_EVENTS_DB_USER}
    password: ${STOP_EVENTS_DB_PASSWORD}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 10000
  flyway:
    enabled: false
  grpc:
    server:
      address: ${STOP_EVENTS_GRPC_ADDRESS:127.0.0.1}
      port: ${STOP_EVENTS_GRPC_PORT:9092}
      reflection:
        enabled: false
      shutdown:
        grace-period: 10s
    client:
      channel:
        default:
          ssl:
            enabled: false

stop-events:
  jobs-enabled: ${STOP_EVENTS_JOBS_ENABLED:true}
  sources:
    - city-id: krakow
      source-id: mpk-bus
    - city-id: krakow
      source-id: mobilis-bus
    - city-id: krakow
      source-id: mpk-tram
  stream-prefix: ${STOP_EVENTS_STREAM_PREFIX:krktransit:realtime:observations:v1}
  state-prefix: ${STOP_EVENTS_STATE_PREFIX:krktransit:stop-events:v1}
  read-count: 500
  read-block: 2s
  inactivity: 3h
  failure-delays: [1s, 5s, 15s, 30s]
  shutdown-timeout: 30s
  statistics:
    read-pool-size: ${STOP_EVENTS_STATISTICS_READ_POOL_SIZE:8}
    connection-wait: 10s
    grpc-token: ${STOP_EVENTS_GRPC_TOKEN:}
    cache:
      prefix: krktransit:stop-events:statistics:v1
      maximum-entries: ${STOP_EVENTS_STATISTICS_CACHE_MAXIMUM_ENTRIES:512}
      maximum-entry-bytes: 65536
      command-timeout: 500ms
  redis:
    url: ${STOP_EVENTS_REDIS_URL:redis://127.0.0.1:6379}
    username: ${STOP_EVENTS_REDIS_USERNAME:default}
    password: ${STOP_EVENTS_REDIS_PASSWORD:}
    client-name: stop-events-service
    connect-timeout: 2s
    command-timeout: 5s
  schedule:
    address: ${STOP_EVENTS_SCHEDULE_ADDRESS:static://127.0.0.1:9090}
    token: ${STOP_EVENTS_SCHEDULE_TOKEN:}
    deadline: 2s
    context-cache-size: 5000
    hash-refresh: 30s
