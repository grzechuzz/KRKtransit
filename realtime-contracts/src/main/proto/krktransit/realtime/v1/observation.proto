syntax = "proto3";

package krktransit.realtime.v1;

import "google/protobuf/timestamp.proto";

option java_package = "pl.krktransit.realtime.contracts.v1";
option java_multiple_files = true;
option java_outer_classname = "ObservationProto";

message Observation {
  Source source = 1;
  google.protobuf.Timestamp fetched_at = 2;
  optional uint64 feed_timestamp = 3;
  oneof payload {
    VehiclePosition vehicle_position = 4;
    TripUpdate trip_update = 5;
  }
}

message Source {
  optional string city_id = 1;
  optional string source_id = 2;
}

message VehiclePosition {
  optional string trip_id = 1;
  optional string vehicle_id = 2;
  optional string license_plate = 3;
  Position position = 4;
  optional string stop_id = 5;
  optional uint32 current_stop_sequence = 6;
  optional int32 current_status = 7;
  optional uint64 timestamp = 8;
}

message Position {
  optional float latitude = 1;
  optional float longitude = 2;
  optional float bearing = 3;
}

message TripUpdate {
  optional string trip_id = 1;
  optional int32 trip_schedule_relationship = 2;
  optional string vehicle_id = 3;
  optional uint64 timestamp = 4;
  repeated StopTimeUpdate stop_time_updates = 5;
}

message StopTimeUpdate {
  optional uint32 stop_sequence = 1;
  optional string stop_id = 2;
  StopTimeEvent arrival = 3;
  StopTimeEvent departure = 4;
  optional int32 schedule_relationship = 5;
}

message StopTimeEvent {
  optional int64 time = 1;
  optional int32 delay = 2;
}
