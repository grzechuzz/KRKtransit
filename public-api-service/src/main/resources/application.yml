spring:
  application:
    name: public-api-service
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
  grpc:
    client:
      channel:
        default:
          ssl:
            enabled: false

server:
  address: ${PUBLIC_API_HTTP_ADDRESS:127.0.0.1}
  port: ${PUBLIC_API_HTTP_PORT:8000}
  forward-headers-strategy: native
  shutdown: graceful

springdoc:
  api-docs:
    enabled: false
    path: /openapi.json
  swagger-ui:
    enabled: false
    path: /docs

public-api:
  allowed-origins:
    - https://krktransit.pl
  statistics:
    address: ${PUBLIC_API_STATISTICS_ADDRESS:static://127.0.0.1:9092}
    token: ${PUBLIC_API_STATISTICS_TOKEN:}
    deadline: 30s
  schedule:
    address: ${PUBLIC_API_SCHEDULE_ADDRESS:static://127.0.0.1:9090}
    token: ${PUBLIC_API_SCHEDULE_TOKEN:}
    deadline: 2s
    trip-cache-size: 50000
    trip-stops-cache-size: 5000
    hash-refresh: 30s
    maximum-concurrent-lookups: 32
  live-vehicles:
    address: ${PUBLIC_API_LIVE_VEHICLES_ADDRESS:static://127.0.0.1:9091}
    token: ${PUBLIC_API_LIVE_VEHICLES_TOKEN:}
    deadline: 2s
    snapshot-lifetime: 3s
  prediction:
    address: ${PUBLIC_API_PREDICTION_ADDRESS:static://127.0.0.1:9093}
    token: ${PUBLIC_API_PREDICTION_TOKEN:}
    deadline: 300ms
  rate-limits:
    maximum-tracked-clients: 100000
    routes:
      - path: /v1/lines/{line_number}/stats/max-delay
        per-minute: ${PUBLIC_API_STATISTICS_PER_MINUTE:20}
      - path: /v1/lines/{line_number}/stats/route-delay
        per-minute: ${PUBLIC_API_STATISTICS_PER_MINUTE:20}
      - path: /v1/lines/{line_number}/stats/punctuality
        per-minute: ${PUBLIC_API_STATISTICS_PER_MINUTE:20}
      - path: /v1/lines/{line_number}/stats/trend
        per-minute: ${PUBLIC_API_STATISTICS_PER_MINUTE:20}
      - path: /v1/vehicles/positions
        per-minute: ${PUBLIC_API_VEHICLES_PER_MINUTE:60}
      - path: /v1/trips/{trip_id}/stops
        per-minute: ${PUBLIC_API_TRIPS_PER_MINUTE:60}
      - path: /v1/trips/{trip_id}/upcoming-stops
        per-minute: ${PUBLIC_API_UPCOMING_STOPS_PER_MINUTE:60}
      - path: /v1/shapes/{shape_id}
        per-minute: ${PUBLIC_API_SHAPES_PER_MINUTE:60}
